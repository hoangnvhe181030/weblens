spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/weblens}
    username: ${DB_USERNAME:weblens}
    password: ${DB_PASSWORD:weblens-local-only}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

weblens:
  security:
    jwt:
      secret: ${WEBLENS_JWT_SECRET:d2VibGVucy1kZXYtb25seS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0yMDI2}
    cookies:
      secure: false
  crawler:
    service-token: ${WEBLENS_SERVICE_TOKEN:weblens-local-service-token-change-me}
