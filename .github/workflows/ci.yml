name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: weblens_crawler_test
          POSTGRES_USER: weblens_test
          POSTGRES_PASSWORD: weblens_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weblens_test -d weblens_crawler_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      clickhouse:
        image: clickhouse/clickhouse-server:26.3
        env:
          CLICKHOUSE_DB: weblens_crawl_analytics
          CLICKHOUSE_USER: weblens_test
          CLICKHOUSE_PASSWORD: weblens_test_password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 19000:9000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      WEBLENS_TEST_POSTGRES_URL: postgres://weblens_test:weblens_test_password@127.0.0.1:5432/weblens_crawler_test?sslmode=disable
      WEBLENS_TEST_CLICKHOUSE_ADDR: 127.0.0.1:19000
      WEBLENS_TEST_CLICKHOUSE_USERNAME: weblens_test
      WEBLENS_TEST_CLICKHOUSE_PASSWORD: weblens_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: crawler/go.mod
          cache-dependency-path: crawler/go.sum
      - name: Verify crawler
        working-directory: crawler
        run: |
          go test ./...
          go vet ./...

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
      - name: Upload backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build
